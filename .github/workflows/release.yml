name: Tagged release

on:
  push:
    tags:
      - 'v3.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.ref_name }}

  publish:
    name: Publish the validated ZIP
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the validated candidate
        uses: actions/download-artifact@v5
        with:
          name: mpadmin2fa-ps9-release
          path: dist

      - name: Verify the artifact checksum
        run: |
          test -f "dist/mpadmin2fa-${GITHUB_REF_NAME}.zip"
          (cd dist && sha256sum --check --strict *.zip.sha256)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            release create "${GITHUB_REF_NAME}"
            "dist/mpadmin2fa-${GITHUB_REF_NAME}.zip"
            "dist/mpadmin2fa-${GITHUB_REF_NAME}.zip.sha256"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "${GITHUB_REF_NAME}"
            --generate-notes
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
