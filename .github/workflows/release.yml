name: Tagged release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Install release tools
        run: composer build:tools

      - name: Build and verify release archive
        run: php tools/release.php "${GITHUB_REF_NAME}"

      - name: Preserve build output
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.event.repository.name }}-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            release create "${GITHUB_REF_NAME}"
            dist/*
            --verify-tag
            --title "${GITHUB_REF_NAME}"
            --generate-notes
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
