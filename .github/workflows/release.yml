name: Tagged release

on:
  push:
    tags:
      - 'v3.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Candidate tag name to validate without publishing
        required: true
        default: v3.0.0-rc.1

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

  verify-artifact:
    name: Verify the publication artifact
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Download the validated candidate
        uses: actions/download-artifact@v5
        with:
          name: mpadmin2fa-ps9-release
          path: dist

      - name: Verify the artifact checksum
        run: |
          test -f "dist/mpadmin2fa-${RELEASE_TAG}.zip"
          (cd dist && sha256sum --check --strict *.zip.sha256)

  publish:
    name: Publish the validated ZIP
    if: github.event_name == 'push'
    needs: verify-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the validated candidate
        uses: actions/download-artifact@v5
        with:
          name: mpadmin2fa-ps9-release
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            release create "${GITHUB_REF_NAME}"
            "dist/mpadmin2fa-${GITHUB_REF_NAME}.zip"
            "dist/mpadmin2fa-${GITHUB_REF_NAME}.zip.sha256"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "${GITHUB_REF_NAME}"
            --generate-notes
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
