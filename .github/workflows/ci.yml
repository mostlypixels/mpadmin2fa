name: Continuous integration

on:
  push:
    branches:
      - 1.x-ps17
  pull_request:
    branches:
      - 1.x-ps17

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PrestaShop ${{ matrix.prestashop }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - prestashop: 1.7.8.0
            php: '7.1'
          - prestashop: 1.7.8.11
            php: '7.1'
          - prestashop: 1.7.8.11
            php: '7.4'

    steps:
      - name: Check out the module
        uses: actions/checkout@v4

      - name: Check out PrestaShop
        uses: actions/checkout@v4
        with:
          repository: PrestaShop/PrestaShop
          ref: ${{ matrix.prestashop }}
          path: prestashop

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          tools: composer:2.2
          coverage: none

      - name: Install PrestaShop dependencies
        run: composer install --working-dir=prestashop --no-dev --prefer-dist --no-interaction --no-progress --no-scripts --ignore-platform-req=php

      - name: Place the module inside PrestaShop
        run: |
          mkdir -p prestashop/modules/mpadmin2fa
          rsync -a \
            --exclude='.git/' \
            --exclude='build/' \
            --exclude='prestashop/' \
            --exclude='vendor/' \
            ./ prestashop/modules/mpadmin2fa/

      - name: Validate Composer metadata
        working-directory: prestashop/modules/mpadmin2fa
        run: composer validate --strict

      - name: Install module dependencies
        working-directory: prestashop/modules/mpadmin2fa
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run unit tests
        working-directory: prestashop/modules/mpadmin2fa
        run: composer test

  package:
    name: Verify scoped release package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the module
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install module dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Install release tools
        run: composer build:tools

      - name: Verify the scoped release build
        run: composer build:scoped
