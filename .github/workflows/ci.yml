name: Continuous integration

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ''
  push:
    branches:
      - 2.x-ps8
  pull_request:
    branches:
      - 2.x-ps8

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PrestaShop ${{ matrix.prestashop }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - prestashop: 8.0.5
            php: '7.2'
          - prestashop: 8.2.8
            php: '7.2'
          - prestashop: 8.2.8
            php: '8.1'

    steps:
      - name: Check out the module
        uses: actions/checkout@v5

      - name: Check out PrestaShop
        uses: actions/checkout@v5
        with:
          repository: PrestaShop/PrestaShop
          ref: ${{ matrix.prestashop }}
          path: prestashop

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Install PrestaShop dependencies
        run: composer install --working-dir=prestashop --no-dev --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Place the module inside PrestaShop
        run: |
          mkdir -p prestashop/modules/mpadmin2fa
          rsync -a \
            --exclude='.git/' \
            --exclude='build/' \
            --exclude='prestashop/' \
            --exclude='vendor/' \
            ./ prestashop/modules/mpadmin2fa/

      - name: Validate Composer metadata
        working-directory: prestashop/modules/mpadmin2fa
        run: composer validate --strict

      - name: Install module dependencies
        working-directory: prestashop/modules/mpadmin2fa
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run unit tests
        working-directory: prestashop/modules/mpadmin2fa
        run: composer test

  package:
    name: Build and verify release ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out the module
        uses: actions/checkout@v5

      - name: Check out the release test platform
        uses: actions/checkout@v5
        with:
          repository: PrestaShop/PrestaShop
          ref: 8.2.8
          path: prestashop

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Prepare the isolated release checkout
        run: |
          composer install --working-dir=prestashop --no-dev --prefer-dist --no-interaction --no-progress --no-scripts
          mkdir -p prestashop/modules/mpadmin2fa
          rsync -a --exclude='.git/' --exclude='build/' --exclude='dist/' --exclude='prestashop/' --exclude='vendor/' ./ prestashop/modules/mpadmin2fa/
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build and verify the exact release ZIP
        working-directory: prestashop/modules/mpadmin2fa
        env:
          MP2FA_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: php tools/release.php "$MP2FA_RELEASE_TAG"

      - name: Preserve the candidate ZIP and checksum
        uses: actions/upload-artifact@v5
        with:
          name: mpadmin2fa-ps8-release
          path: prestashop/modules/mpadmin2fa/dist/
          if-no-files-found: error
          retention-days: 7

  lifecycle:
    needs: package
    name: Packaged lifecycle and requests / PS ${{ matrix.prestashop }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - prestashop: 8.0.0
            php: '7.2'
          - prestashop: 8.2.8
            php: '8.1'
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: prestashop
          MYSQL_DATABASE: prestashop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pprestashop"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out the module
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out PrestaShop
        uses: actions/checkout@v5
        with:
          repository: PrestaShop/PrestaShop
          ref: ${{ matrix.prestashop }}
          path: prestashop

      - name: Set up release-build PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: gd, intl, mbstring, mysqli, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Download the exact candidate ZIP
        uses: actions/download-artifact@v5
        with:
          name: mpadmin2fa-ps8-release
          path: dist

      - name: Verify the candidate checksum and install test dependencies
        run: |
          (cd dist && sha256sum --check --strict *.zip.sha256)
          composer install --prefer-dist --no-interaction --no-progress

      - name: Build the pinned historical 0.2.7 and 0.2.8 packages
        env:
          MP2FA_HISTORICAL_OUTPUT: ${{ runner.temp }}/mp2fa-historical
        run: bash tests/Integration/build_historical_package.sh

      - name: Set up target PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl, mbstring, mysqli, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Install PrestaShop dependencies
        run: composer install --working-dir=prestashop --no-dev --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Set up Classic theme build tools
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Build storefront and back-office assets
        env:
          # PS 8.0.0's historic css-loader/webpack peers predate npm 7 enforcement.
          npm_config_legacy_peer_deps: ${{ matrix.prestashop == '8.0.0' && 'true' || 'false' }}
        run: |
          bash prestashop/tools/assets/build.sh front-classic
          bash prestashop/tools/assets/build.sh admin-default
          bash prestashop/tools/assets/build.sh admin-new-theme

      - name: Set up isolated browser test tools
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependencies
        working-directory: tests/Browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Generate disposable test credentials
        run: |
          test_password="$(openssl rand -hex 24)"
          echo "::add-mask::$test_password"
          printf 'MP2FA_TEST_EMAIL=mp2fa-ci-%s-%s@example.test\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'MP2FA_TEST_PASSWORD=%s\n' "$test_password" >> "$GITHUB_ENV"

      - name: Install the disposable PrestaShop shop
        run: |
          php prestashop/install-dev/index_cli.php \
            --domain=localhost \
            --db_server=127.0.0.1 \
            --db_name=prestashop \
            --db_user=root \
            --db_password=prestashop \
            --prefix=ps_ \
            --language=en \
            --country=fr \
            --email="$MP2FA_TEST_EMAIL" \
            --password="$MP2FA_TEST_PASSWORD" \
            --ssl=0

      - name: Install only the candidate ZIP into the disposable shop
        run: |
          unzip -q dist/*.zip -d prestashop/modules
          (cd prestashop/modules/mpadmin2fa && sha256sum --check --quiet SHA256SUMS)
          find prestashop/modules/mpadmin2fa -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install an isolated HTTPS request-test runtime
        run: |
          # setup-php can use cached binaries without enabling the PHP package repository.
          sudo add-apt-repository --yes ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apache2 libapache2-mod-php${{ matrix.php }}

      - name: Verify lifecycle, historical upgrade, HTTPS, browser, and rollback
        env:
          MP2FA_INTEGRATION: '1'
          MP2FA_HISTORICAL_OUTPUT: ${{ runner.temp }}/mp2fa-historical
          MP2FA_PS_ROOT: ${{ github.workspace }}/prestashop
          MP2FA_APACHE_PHP_MODULE: /usr/lib/apache2/modules/libphp${{ matrix.php }}.so
        run: bash tests/Integration/run_lifecycle.sh
