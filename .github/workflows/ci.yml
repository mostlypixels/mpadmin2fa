name: Continuous integration

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ''
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PrestaShop ${{ matrix.prestashop }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - prestashop: 9.0.0
            php: '8.1'
            composer_flags: ''
          - prestashop: 9.0.3
            php: '8.4'
            composer_flags: ''
          - prestashop: 9.1.5
            php: '8.4'
            composer_flags: ''
          - prestashop: 9.1.5
            php: '8.5'
            composer_flags: '--ignore-platform-req=php'

    steps:
      - name: Check out the module
        uses: actions/checkout@v5

      - name: Check out PrestaShop
        uses: actions/checkout@v5
        with:
          repository: PrestaShop/PrestaShop
          ref: ${{ matrix.prestashop }}
          path: prestashop

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Install PrestaShop dependencies
        run: composer install --working-dir=prestashop --no-dev --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Place the module inside PrestaShop
        run: |
          mkdir -p prestashop/modules/mpadmin2fa
          rsync -a \
            --exclude='.git/' \
            --exclude='build/' \
            --exclude='prestashop/' \
            --exclude='vendor/' \
            ./ prestashop/modules/mpadmin2fa/

      - name: Validate Composer metadata
        working-directory: prestashop/modules/mpadmin2fa
        run: composer validate --strict

      - name: Install module dependencies
        working-directory: prestashop/modules/mpadmin2fa
        run: composer install --prefer-dist --no-interaction --no-progress ${{ matrix.composer_flags }}

      - name: Scan PHP syntax
        working-directory: prestashop/modules/mpadmin2fa
        run: find . -path ./vendor -prune -o -path ./build -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run unit tests
        working-directory: prestashop/modules/mpadmin2fa
        run: composer test

  browser:
    name: Admin AJAX step-up browser redirect
    runs-on: ubuntu-latest

    steps:
      - name: Check out the module
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify the real browser redirect listener
        run: node tests/Browser/admin_step_up_browser_test.mjs

  package:
    name: Build and verify release ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out the module
        uses: actions/checkout@v5

      - name: Check out the release test platform
        uses: actions/checkout@v5
        with:
          repository: PrestaShop/PrestaShop
          ref: 9.0.0
          path: prestashop

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Prepare the isolated release checkout
        run: |
          composer install --working-dir=prestashop --no-dev --prefer-dist --no-interaction --no-progress --no-scripts
          mkdir -p prestashop/modules/mpadmin2fa
          rsync -a --exclude='.git/' --exclude='build/' --exclude='dist/' --exclude='prestashop/' --exclude='vendor/' ./ prestashop/modules/mpadmin2fa/
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build and verify the exact release ZIP
        working-directory: prestashop/modules/mpadmin2fa
        env:
          MP2FA_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: php tools/release.php "$MP2FA_RELEASE_TAG"

      - name: Preserve the candidate ZIP and checksum
        uses: actions/upload-artifact@v5
        with:
          name: mpadmin2fa-ps9-release
          path: prestashop/modules/mpadmin2fa/dist/
          if-no-files-found: error
          retention-days: 7

  lifecycle:
    needs: package
    name: Packaged lifecycle and requests on PS ${{ matrix.prestashop }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - prestashop: 9.0.0
            php: '8.1'
          - prestashop: 9.1.5
            php: '8.4'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: prestashop
          MYSQL_DATABASE: prestashop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pprestashop"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out the module
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify the historical packages belong to the PS8 release line
        run: bash tests/Integration/verify_historical_release_scope.sh

      - name: Check out PrestaShop
        uses: actions/checkout@v5
        with:
          repository: PrestaShop/PrestaShop
          ref: ${{ matrix.prestashop }}
          path: prestashop

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl, mbstring, mysqli, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install test and platform dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer install --working-dir=prestashop --no-dev --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Download the exact candidate ZIP
        uses: actions/download-artifact@v5
        with:
          name: mpadmin2fa-ps9-release
          path: dist

      - name: Verify and install only the candidate ZIP
        run: |
          (cd dist && sha256sum --check --strict *.zip.sha256)
          printf 'MP2FA_CANDIDATE_SHA256=%s\n' "$(sha256sum dist/*.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"
          rm -rf prestashop/modules/mpadmin2fa
          unzip -q dist/*.zip -d prestashop/modules
          (cd prestashop/modules/mpadmin2fa && sha256sum --check --quiet SHA256SUMS)
          find prestashop/modules/mpadmin2fa -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build storefront and back-office assets
        run: |
          bash prestashop/tools/assets/build.sh front-classic --force
          if [[ -d prestashop/themes/hummingbird ]]; then
            bash prestashop/tools/assets/build.sh front-hummingbird --force
          fi
          bash prestashop/tools/assets/build.sh admin-default --force
          bash prestashop/tools/assets/build.sh admin-new-theme --force

      - name: Generate disposable test credentials
        run: |
          test_password="$(openssl rand -hex 24)"
          echo "::add-mask::$test_password"
          printf 'MP2FA_TEST_EMAIL=mp2fa-ci-%s-%s@example.test\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'MP2FA_TEST_PASSWORD=%s\n' "$test_password" >> "$GITHUB_ENV"

      - name: Install PrestaShop
        run: |
          php prestashop/install-dev/index_cli.php \
            --domain=localhost \
            --db_server=127.0.0.1 \
            --db_name=prestashop \
            --db_user=root \
            --db_password=prestashop \
            --prefix=ps_ \
            --language=en \
            --country=fr \
            --email="$MP2FA_TEST_EMAIL" \
            --password="$MP2FA_TEST_PASSWORD" \
            --ssl=0

      - name: Install and compile the locally built module
        run: |
          php prestashop/bin/console prestashop:module install mpadmin2fa --no-interaction
          MP2FA_PS_ROOT="$PWD/prestashop" php tests/Integration/lifecycle_state.php verify-install
          MP2FA_PS_ROOT="$PWD/prestashop" php tests/Integration/lifecycle_state.php verify-repeated-install
          php prestashop/bin/console cache:clear --env=prod --no-debug
          php prestashop/bin/console debug:router --env=prod --no-debug | grep mpadmin2fa
          php prestashop/bin/console list --raw --env=prod --no-debug | grep mpadmin2fa

      - name: Set up browser-listener test runtime
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify the installed browser listener
        env:
          MP2FA_LISTENER_PATH: ${{ github.workspace }}/prestashop/modules/mpadmin2fa/views/js/admin-step-up.js
        run: node tests/Browser/admin_step_up_browser_test.mjs

      - name: Install isolated installed-package browser tools
        working-directory: tests/Browser
        run: |
          npm ci --no-audit --no-fund
          test -x /usr/bin/google-chrome

      - name: Verify upgrade migration and atomic counting
        run: |
          MP2FA_PS_ROOT="$PWD/prestashop" php tests/Integration/lifecycle_state.php prepare-upgrade
          php prestashop/bin/console prestashop:module upgrade mpadmin2fa --no-interaction
          MP2FA_PS_ROOT="$PWD/prestashop" php tests/Integration/lifecycle_state.php verify-install
          MP2FA_INTEGRATION=1 MP2FA_PS_ROOT="$PWD/prestashop" php vendor/bin/phpunit -c phpunit.xml.dist --filter AtomicRateLimitIntegrationTest tests/Integration/AtomicRateLimitIntegrationTest.php
          MP2FA_INTEGRATION=1 MP2FA_PS_ROOT="$PWD/prestashop" php vendor/bin/phpunit -c phpunit.xml.dist tests/Integration/UtcRateLimitIntegrationTest.php

      - name: Install isolated HTTPS request-test runtime
        run: |
          if [ -f /etc/apt/sources.list.d/google-chrome.list ]; then
            sudo sed -i '/dl.google.com\/linux\/chrome-stable/d' /etc/apt/sources.list.d/google-chrome.list
          fi
          sudo add-apt-repository --yes ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apache2 libapache2-mod-php${{ matrix.php }}

      - name: Verify real HTTPS login and installed-browser journeys
        env:
          CHROME_BIN: /usr/bin/google-chrome
          MP2FA_INTEGRATION: '1'
          MP2FA_PS_ROOT: ${{ github.workspace }}/prestashop
          MP2FA_APACHE_PHP_MODULE: /usr/lib/apache2/modules/libphp${{ matrix.php }}.so
        run: bash tests/Integration/run_requests.sh

      - name: Verify every install rollback stage and immediate reinstall
        env:
          MP2FA_INTEGRATION: '1'
          MP2FA_PS_ROOT: ${{ github.workspace }}/prestashop
        run: |
          php prestashop/bin/console prestashop:module uninstall mpadmin2fa --no-interaction
          MP2FA_PS_ROOT="$PWD/prestashop" php tests/Integration/lifecycle_state.php verify-cleanup
          export MP2FA_LIFECYCLE_RUNTIME
          MP2FA_LIFECYCLE_RUNTIME="$(mktemp -d /tmp/mp2fa-lifecycle.XXXXXX)"
          chmod 700 "$MP2FA_LIFECYCLE_RUNTIME"
          trap 'php tests/Integration/failure_injection.php restore' EXIT
          for stage in before-parent after-schema after-configuration after-hooks after-tabs; do
            php tests/Integration/failure_injection.php prepare "$stage"
            output="$(php prestashop/bin/console prestashop:module install mpadmin2fa --no-interaction 2>&1)" || true
            if ! grep -q "injected mp2fa $stage failure" <<< "$output"; then
              printf '%s\n' "$output"
              echo "The $stage fixture did not reach the expected installation stage."
              exit 1
            fi
            php tests/Integration/failure_injection.php verify
            MP2FA_PS_ROOT="$PWD/prestashop" php tests/Integration/lifecycle_state.php verify-cleanup
            php prestashop/bin/console prestashop:module install mpadmin2fa --no-interaction
            MP2FA_PS_ROOT="$PWD/prestashop" php tests/Integration/lifecycle_state.php verify-install
            php prestashop/bin/console prestashop:module uninstall mpadmin2fa --no-interaction
            MP2FA_PS_ROOT="$PWD/prestashop" php tests/Integration/lifecycle_state.php verify-cleanup
            echo "PASS: $stage rollback and immediate reinstall"
          done
