name: Continuous integration

on:
  push:
    branches:
      - 2.x-ps8
  pull_request:
    branches:
      - 2.x-ps8

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PrestaShop ${{ matrix.prestashop }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - prestashop: 8.0.5
            php: '7.2'
          - prestashop: 8.2.8
            php: '7.2'
          - prestashop: 8.2.8
            php: '8.1'

    steps:
      - name: Check out the module
        uses: actions/checkout@v5

      - name: Check out PrestaShop
        uses: actions/checkout@v5
        with:
          repository: PrestaShop/PrestaShop
          ref: ${{ matrix.prestashop }}
          path: prestashop

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Install PrestaShop dependencies
        run: composer install --working-dir=prestashop --no-dev --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Place the module inside PrestaShop
        run: |
          mkdir -p prestashop/modules/mpadmin2fa
          rsync -a \
            --exclude='.git/' \
            --exclude='build/' \
            --exclude='prestashop/' \
            --exclude='vendor/' \
            ./ prestashop/modules/mpadmin2fa/

      - name: Validate Composer metadata
        working-directory: prestashop/modules/mpadmin2fa
        run: composer validate --strict

      - name: Install module dependencies
        working-directory: prestashop/modules/mpadmin2fa
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run unit tests
        working-directory: prestashop/modules/mpadmin2fa
        run: composer test

  package:
    name: Verify scoped release package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the module
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install module dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Install release tools
        run: composer build:tools

      - name: Verify the scoped release build
        run: composer build:scoped

  lifecycle:
    name: Packaged lifecycle / PS ${{ matrix.prestashop }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - prestashop: 8.0.0
            php: '7.2'
          - prestashop: 8.2.8
            php: '8.1'
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: prestashop
          MYSQL_DATABASE: prestashop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pprestashop"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out the module
        uses: actions/checkout@v5

      - name: Check out PrestaShop
        uses: actions/checkout@v5
        with:
          repository: PrestaShop/PrestaShop
          ref: ${{ matrix.prestashop }}
          path: prestashop

      - name: Set up release-build PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: gd, intl, mbstring, mysqli, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Build the scoped module
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer build:tools
          composer build:scoped
          (cd build/mpadmin2fa && sha256sum --check --quiet SHA256SUMS)

      - name: Set up target PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl, mbstring, mysqli, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Install PrestaShop dependencies
        run: composer install --working-dir=prestashop --no-dev --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Set up Classic theme build tools
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Build Classic theme assets
        run: bash prestashop/tools/assets/build.sh front-classic

      - name: Install the disposable PrestaShop shop
        run: |
          php prestashop/install-dev/index_cli.php \
            --domain=localhost \
            --db_server=127.0.0.1 \
            --db_name=prestashop \
            --db_user=root \
            --db_password=prestashop \
            --prefix=ps_ \
            --language=en \
            --country=fr \
            --email=demo@prestashop.com \
            --password=Pr3st4Sh0P \
            --ssl=0

      - name: Place only the built package in the installed shop
        run: |
          mkdir -p prestashop/modules/mpadmin2fa
          rsync -a build/mpadmin2fa/ prestashop/modules/mpadmin2fa/
          find prestashop/modules/mpadmin2fa -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify clean install, upgrade, atomic counting, and every failure stage
        env:
          MP2FA_INTEGRATION: '1'
          MP2FA_PS_ROOT: ${{ github.workspace }}/prestashop
        run: bash tests/Integration/run_lifecycle.sh
