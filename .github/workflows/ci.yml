name: Continuous integration

on:
  push:
    branches:
      - 1.x-ps17
  pull_request:
    branches:
      - 1.x-ps17

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PrestaShop ${{ matrix.prestashop }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - prestashop: 1.7.8.0
            php: '7.1'
          - prestashop: 1.7.8.11
            php: '7.1'
          - prestashop: 1.7.8.11
            php: '7.4'

    steps:
      - name: Check out the module
        uses: actions/checkout@v4

      - name: Check out PrestaShop
        uses: actions/checkout@v4
        with:
          repository: PrestaShop/PrestaShop
          ref: ${{ matrix.prestashop }}
          path: prestashop

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          tools: composer:2.2
          coverage: none

      - name: Install PrestaShop dependencies
        run: composer install --working-dir=prestashop --no-dev --prefer-dist --no-interaction --no-progress --no-scripts --ignore-platform-req=php

      - name: Place the module inside PrestaShop
        run: |
          mkdir -p prestashop/modules/mpadmin2fa
          rsync -a \
            --exclude='.git/' \
            --exclude='build/' \
            --exclude='prestashop/' \
            --exclude='vendor/' \
            ./ prestashop/modules/mpadmin2fa/

      - name: Validate Composer metadata
        working-directory: prestashop/modules/mpadmin2fa
        run: composer validate --strict

      - name: Install module dependencies
        working-directory: prestashop/modules/mpadmin2fa
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Scan PHP syntax
        working-directory: prestashop/modules/mpadmin2fa
        run: find . -path ./vendor -prune -o -path ./build -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run unit tests
        working-directory: prestashop/modules/mpadmin2fa
        run: composer test

  package:
    name: Verify scoped release package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the module
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install module dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Install release tools
        run: composer build:tools

      - name: Verify the scoped release build
        run: composer build:scoped

      - name: Upload the installable module
        uses: actions/upload-artifact@v4
        with:
          name: mpadmin2fa-ps17-package
          path: build/mpadmin2fa/
          if-no-files-found: error

  lifecycle:
    name: Packaged lifecycle and requests / PS ${{ matrix.prestashop }} / PHP ${{ matrix.php }}
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prestashop: ['1.7.8.0', '1.7.8.11']
        php: ['7.1', '7.4']
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: prestashop
          MYSQL_DATABASE: prestashop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pprestashop"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out the test harness and historical commits
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out PrestaShop
        uses: actions/checkout@v4
        with:
          repository: PrestaShop/PrestaShop
          ref: ${{ matrix.prestashop }}
          path: prestashop

      - name: Set up historical package tools
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip
          tools: composer:2.2
          coverage: none

      - name: Build the genuine PS 1.7 version 0.2.7 snapshot
        env:
          MP2FA_HISTORICAL_OUTPUT: ${{ runner.temp }}/mp2fa-historical
        run: bash tests/Integration/build_historical_package.sh

      - name: Set up the target PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, gd, intl, mbstring, mysqli, pdo_mysql, zip
          tools: composer:2.2
          coverage: none

      - name: Install PrestaShop and harness dependencies
        run: |
          composer install --working-dir=prestashop --no-dev --prefer-dist --no-interaction --no-progress --no-scripts
          composer install --prefer-dist --no-interaction --no-progress

      - name: Download the scoped release artifact
        uses: actions/download-artifact@v4
        with:
          name: mpadmin2fa-ps17-package
          path: prestashop/modules/mpadmin2fa

      - name: Verify package checksums and target PHP syntax
        run: |
          (cd prestashop/modules/mpadmin2fa && sha256sum --check --quiet SHA256SUMS)
          find prestashop/modules/mpadmin2fa -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Generate masked disposable test credentials
        run: |
          test_password="$(openssl rand -hex 24)"
          echo "::add-mask::$test_password"
          printf 'MP2FA_TEST_EMAIL=mp2fa-ci-%s-%s@example.test\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'MP2FA_TEST_PASSWORD=%s\n' "$test_password" >> "$GITHUB_ENV"

      - name: Install the disposable PrestaShop shop
        run: |
          php prestashop/install-dev/index_cli.php \
            --domain=localhost \
            --db_server=127.0.0.1 \
            --db_name=prestashop \
            --db_user=root \
            --db_password=prestashop \
            --prefix=ps_ \
            --language=en \
            --country=fr \
            --email="$MP2FA_TEST_EMAIL" \
            --password="$MP2FA_TEST_PASSWORD" \
            --ssl=0

      - name: Install the isolated HTTPS runtime
        run: |
          sudo add-apt-repository --yes ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apache2 libapache2-mod-php${{ matrix.php }}

      - name: Verify packaged lifecycle, requests, database races, alerts, and upgrades
        env:
          MP2FA_INTEGRATION: '1'
          MP2FA_PS_ROOT: ${{ github.workspace }}/prestashop
          MP2FA_HISTORICAL_OUTPUT: ${{ runner.temp }}/mp2fa-historical
          MP2FA_APACHE_PHP_MODULE: /usr/lib/apache2/modules/libphp${{ matrix.php }}.so
        run: |
          set -o pipefail
          bash tests/Integration/run_lifecycle.sh 2>&1 | tee "${RUNNER_TEMP}/mp2fa-results.log"

      - name: Retain sanitized test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps17-results-${{ matrix.prestashop }}-php${{ matrix.php }}
          path: ${{ runner.temp }}/mp2fa-results.log
          if-no-files-found: ignore
