name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PrestaShop ${{ matrix.prestashop }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - prestashop: 9.0.0
            php: '8.1'
            composer_flags: ''
          - prestashop: 9.0.3
            php: '8.4'
            composer_flags: ''
          - prestashop: 9.1.5
            php: '8.4'
            composer_flags: ''
          - prestashop: 9.1.5
            php: '8.5'
            composer_flags: '--ignore-platform-req=php'

    steps:
      - name: Check out the module
        uses: actions/checkout@v5

      - name: Check out PrestaShop
        uses: actions/checkout@v5
        with:
          repository: PrestaShop/PrestaShop
          ref: ${{ matrix.prestashop }}
          path: prestashop

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Install PrestaShop dependencies
        run: composer install --working-dir=prestashop --no-dev --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Place the module inside PrestaShop
        run: |
          mkdir -p prestashop/modules/mpadmin2fa
          rsync -a \
            --exclude='.git/' \
            --exclude='build/' \
            --exclude='prestashop/' \
            --exclude='vendor/' \
            ./ prestashop/modules/mpadmin2fa/

      - name: Validate Composer metadata
        working-directory: prestashop/modules/mpadmin2fa
        run: composer validate --strict

      - name: Install module dependencies
        working-directory: prestashop/modules/mpadmin2fa
        run: composer install --prefer-dist --no-interaction --no-progress ${{ matrix.composer_flags }}

      - name: Scan PHP syntax
        working-directory: prestashop/modules/mpadmin2fa
        run: find . -path ./vendor -prune -o -path ./build -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run unit tests
        working-directory: prestashop/modules/mpadmin2fa
        run: composer test

  lifecycle:
    name: Locally built package lifecycle on PS 9.0.2
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: prestashop
          MYSQL_DATABASE: prestashop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pprestashop"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out the module
        uses: actions/checkout@v5

      - name: Check out PrestaShop
        uses: actions/checkout@v5
        with:
          repository: PrestaShop/PrestaShop
          ref: 9.0.2
          path: prestashop

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: gd, intl, mbstring, mysqli, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Install dependencies and build locally
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer install --working-dir=prestashop --no-dev --prefer-dist --no-interaction --no-progress --no-scripts
          composer build:scoped
          mkdir -p prestashop/modules/mpadmin2fa
          rsync -a --delete build/mpadmin2fa/ prestashop/modules/mpadmin2fa/

      - name: Install PrestaShop
        run: |
          php prestashop/install-dev/index_cli.php \
            --domain=localhost \
            --db_server=127.0.0.1 \
            --db_name=prestashop \
            --db_user=root \
            --db_password=prestashop \
            --prefix=ps_ \
            --language=en \
            --country=fr \
            --email=demo@prestashop.com \
            --password=Pr3st4Sh0P \
            --ssl=0

      - name: Install and compile the locally built module
        run: |
          php prestashop/bin/console prestashop:module install mpadmin2fa --no-interaction
          MP2FA_PS_ROOT="$PWD/prestashop" php tests/Integration/lifecycle_state.php verify-install
          php prestashop/bin/console cache:clear --env=prod --no-debug
          php prestashop/bin/console debug:router --env=prod --no-debug | grep mpadmin2fa
          php prestashop/bin/console list --raw --env=prod --no-debug | grep mpadmin2fa

      - name: Verify upgrade migration and atomic counting
        run: |
          MP2FA_PS_ROOT="$PWD/prestashop" php tests/Integration/lifecycle_state.php prepare-upgrade
          php prestashop/bin/console prestashop:module upgrade mpadmin2fa --no-interaction
          MP2FA_PS_ROOT="$PWD/prestashop" php tests/Integration/lifecycle_state.php verify-install
          MP2FA_INTEGRATION=1 MP2FA_PS_ROOT="$PWD/prestashop" php vendor/bin/phpunit -c phpunit.xml.dist --filter AtomicRateLimitIntegrationTest tests/Integration/AtomicRateLimitIntegrationTest.php

      - name: Verify tab-stage failure rollback
        run: |
          php prestashop/bin/console prestashop:module uninstall mpadmin2fa --no-interaction
          MP2FA_PS_ROOT="$PWD/prestashop" php tests/Integration/lifecycle_state.php create-tab-trigger
          install_output="$(php prestashop/bin/console prestashop:module install mpadmin2fa --no-interaction 2>&1)"
          printf '%s\n' "$install_output"
          if ! grep -q "Cannot install module" <<< "$install_output"; then
            echo "The injected installation failure unexpectedly succeeded."
            exit 1
          fi
          MP2FA_PS_ROOT="$PWD/prestashop" php tests/Integration/lifecycle_state.php verify-rollback

      - name: Verify final install and uninstall cleanup
        run: |
          php prestashop/bin/console prestashop:module install mpadmin2fa --no-interaction
          php prestashop/bin/console prestashop:module uninstall mpadmin2fa --no-interaction
          MP2FA_PS_ROOT="$PWD/prestashop" php tests/Integration/lifecycle_state.php verify-cleanup
